<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Pages</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: #1a1a1a;
      background: #ffffff;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #111;
      margin: 0 0 0.5rem;
    }
    .intro {
      color: #555;
      font-size: 0.95rem;
      margin: 0 0 2.5rem;
    }
    h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #111;
      margin: 0 0 0.5rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0 0 2rem;
    }
    ul li {
      margin-bottom: 0.35rem;
    }
    a {
      color: #0066cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1.25rem;
      border-top: 1px solid #e5e5e5;
      font-size: 0.8rem;
      color: #999;
    }
    footer a { color: #888; }
    @media (max-width: 480px) {
      .container { padding: 2rem 1.25rem 4rem; }
      h1 { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div class="container">

    <h1>Legal Pages</h1>
    <p class="intro">Legal documents for apps published by Yihang Yin.</p>

    <h2>DueSnark</h2>
    <ul>
      <li><a href="./duesnark/privacy/">Privacy Policy</a></li>
      <li><a href="./duesnark/terms/">Terms of Use</a></li>
    </ul>

    <footer>
      <p>Contact: <a href="mailto:yinyhappsupport@163.com">yinyhappsupport@163.com</a></p>
    </footer>

  </div>
</body>
</html>
